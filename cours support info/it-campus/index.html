<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Campus - Portail Technique</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        // Using slate, sky and violet built-in colors
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a; /* slate-950 */
        }
        ::-webkit-scrollbar-thumb {
            background: #334155; /* slate-700 */
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569; /* slate-600 */
        }
        body {
            font-family: 'Inter', sans-serif;
        }
        pre, code, .font-mono {
            font-family: 'Fira Code', monospace;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-300 h-screen flex overflow-hidden selection:bg-sky-500 selection:text-white">

    <!-- Mobile Header -->
    <div class="lg:hidden absolute top-0 left-0 right-0 h-16 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-4 z-30">
        <button onclick="app.renderHome()" class="font-bold text-slate-100 flex items-center gap-2 hover:text-sky-400 transition-colors cursor-pointer focus:outline-none">
            <svg class="w-6 h-6 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            IT Campus
        </button>
        <button id="mobile-menu-btn" class="p-2 text-slate-400 hover:text-slate-100 rounded-md transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
    </div>

    <!-- Sidebar Overlay (Mobile) -->
    <div id="sidebar-overlay" class="lg:hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-20 hidden transition-opacity opacity-0"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="bg-slate-900 border-r border-slate-800 w-80 flex-shrink-0 h-full flex flex-col transition-transform duration-300 ease-in-out z-30 fixed lg:relative transform -translate-x-full lg:translate-x-0 pt-16 lg:pt-0">
        <div class="h-16 flex items-center px-6 border-b border-slate-800 hidden lg:flex">
            <button onclick="app.renderHome()" class="font-bold text-xl text-slate-100 flex items-center gap-3 hover:text-sky-400 transition-colors cursor-pointer focus:outline-none">
                <svg class="w-7 h-7 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                IT Campus
            </button>
            <button onclick="app.toggleDesktopSidebar()" class="text-slate-500 hover:text-slate-300 transition-colors ml-auto focus:outline-none" title="Masquer le menu">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path></svg>
            </button>
        </div>
        


        <nav class="flex-1 overflow-y-auto p-4 space-y-4" id="nav-container">
            <!-- Sidebar injected by JS -->
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 h-full overflow-y-auto bg-slate-950 pt-16 lg:pt-0 scroll-smooth relative" id="main-content">
        <!-- Desktop Floating Toggle (hidden by default) -->
        <button id="desktop-toggle-btn" onclick="app.toggleDesktopSidebar()" class="hidden lg:flex fixed top-4 left-4 z-40 p-2.5 bg-slate-900 border border-slate-700 rounded-lg text-slate-400 hover:text-white shadow-lg transition-all focus:outline-none opacity-0 pointer-events-none" title="Afficher le menu">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <!-- Content injected by JS -->
    </main>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
