<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Campus - Portail Technique</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        retro: {
                            dark: '#0c0e14',
                            panel: '#131620',
                            card: '#191d2b',
                            border: '#2a3147',
                            amber: '#f59e0b',
                            green: '#22c55e',
                            cyan: '#06b6d4',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                        pixel: ['"Pixelify Sans"', 'system-ui', 'sans-serif'],
                        arcade: ['"Press Start 2P"', 'monospace'],
                        vt: ['"VT323"', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-app);
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border: 1px solid var(--border-muted);
            border-radius: 0px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-green-muted);
        }
        body, main, p, li, td, th, span, label {
            font-family: var(--font-body);
        }
        pre, code, .font-mono {
            font-family: 'Fira Code', monospace;
        }
        h1.font-pixel, h2.font-pixel, h3.font-pixel, .badge.font-pixel, .badge-terminal {
            font-family: 'Pixelify Sans', system-ui, sans-serif;
        }
        @keyframes blinkCursor {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        .animate-pixel-cursor {
            animation: blinkCursor 0.8s infinite;
        }
        /* Retro physical push button */
        .pixel-btn {
            box-shadow: 3px 3px 0px #000;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
        }
        .pixel-btn:hover {
            transform: translate(1px, 1px);
            box-shadow: 2px 2px 0px #000;
        }
        .pixel-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 0px 0px 0px #000;
        }
        /* Retro pixel card shadow */
        .pixel-card {
            box-shadow: 4px 4px 0px 0px #000;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .pixel-card:hover {
            transform: translate(-1px, -1px);
            box-shadow: 5px 5px 0px 0px #000;
        }
        /* 3D Pixel text shadow */
        .pixel-title-shadow {
            text-shadow: 3px 3px 0px #000, 5px 5px 0px #18181b;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="terminal-theme.css">
</head>
<body class="bg-[var(--bg-app)] text-[var(--text-primary)] h-screen flex overflow-hidden selection:bg-[var(--primary-green)] selection:text-black">

    <!-- Subtle CRT Scanlines & Vignette Overlay -->
    <div class="crt-overlay"></div>

    <!-- Matrix Intro -->
    <div id="matrix-intro" class="fixed inset-0 bg-black z-[9999]">
        <div id="matrix-screen" class="absolute inset-0 flex flex-col justify-center items-center font-mono p-4 lg:p-8 animate-crt-boot bg-black overflow-hidden">
            <div class="matrix-noise"></div>
            <div class="w-full max-w-4xl text-left relative z-20">
            <div class="text-[var(--primary-green)] text-lg lg:text-2xl mb-8 opacity-80" style="text-shadow: 0 0 10px rgba(0,255,65,0.5);">
                IT-CAMPUS OS [Version 2.4.19045]<br>
                (c) IT Campus Corporation. Tous droits réservés.
            </div>
            <div id="typewriter-text" class="text-[var(--primary-green)] text-lg lg:text-2xl leading-relaxed min-h-[300px] whitespace-pre-wrap mb-8" style="text-shadow: 0 0 10px rgba(0,255,65,0.5);"></div>
            
            <div id="matrix-buttons" class="flex flex-col gap-3 mt-4 opacity-0 transition-opacity duration-1000 ease-in-out pointer-events-none">
                <div class="text-[var(--text-muted)] text-sm mb-2">>_ ATTENTE DE LA DÉCISION DE L'OPÉRATEUR...</div>
                <button id="pill-red" class="text-left font-mono text-[var(--primary-green)] hover:bg-[var(--primary-green)] hover:text-black py-2 px-4 transition-colors focus:outline-none w-fit cursor-pointer border border-transparent hover:border-[var(--primary-green)]">
                    [1] ACTIVER LE PROTOCOLE ROUGE (ACCÈS ROOT)
                </button>
                <button id="pill-blue" class="text-left font-mono text-zinc-500 hover:bg-zinc-800 hover:text-white py-2 px-4 transition-colors focus:outline-none w-fit cursor-pointer border border-transparent hover:border-zinc-500">
                    [2] ACTIVER LE PROTOCOLE BLEU (MISE EN VEILLE)
                </button>
            </div>
        </div>
        <div class="absolute bottom-8 text-zinc-500 text-xs tracking-widest text-center w-full animate-pulse">
            [ Appuyez sur Espace pour passer ]
        </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (localStorage.getItem('matrixIntroPlayed') === 'true' && urlParams.get('intro') !== '1') {
            document.getElementById('matrix-intro').style.display = 'none';
        }
    </script>

    <!-- Mobile Header -->
    <div class="lg:hidden absolute top-0 left-0 right-0 h-16 bg-[var(--bg-card)] border-b-2 border-[var(--border-muted)] flex items-center justify-between px-4 z-30">
        <button onclick="app.renderHome()" class="font-pixel text-xl text-[var(--primary-green)] flex items-center gap-2.5 hover:text-emerald-300 transition-colors cursor-pointer focus:outline-none pixel-title-shadow group">
            <span class="inline-block transform group-hover:scale-110 transition-transform">
                <svg class="w-7 h-7 flex-shrink-0" viewBox="0 0 16 16" fill="none" shape-rendering="crispEdges">
                    <path d="M2 1h12v10H2V1zm1 1v8h10V2H3z" fill="#00ff41"/>
                    <rect x="4" y="3" width="8" height="6" fill="#000000"/>
                    <rect x="5" y="4" width="2" height="1" fill="#00ff41"/>
                    <rect x="6" y="5" width="2" height="1" fill="#00ff41"/>
                    <rect x="5" y="6" width="2" height="1" fill="#00ff41"/>
                    <rect x="8" y="7" width="3" height="1" fill="#00cc33"/>
                    <rect x="12" y="9" width="1" height="1" fill="#ff9f00"/>
                    <rect x="6" y="11" width="4" height="2" fill="#00cc33"/>
                    <rect x="4" y="13" width="8" height="2" fill="#00ff41"/>
                </svg>
            </span>
            <span>IT CAMPUS</span>
        </button>
        <button id="mobile-menu-btn" class="pixel-btn p-2 bg-black border-2 border-[var(--border-muted)] text-[var(--primary-green)] hover:text-emerald-300 transition-colors focus:outline-none" title="Menu">
            <svg class="w-5 h-5" viewBox="0 0 16 16" fill="currentColor" shape-rendering="crispEdges">
                <rect x="2" y="3" width="12" height="2"/>
                <rect x="2" y="7" width="12" height="2"/>
                <rect x="2" y="11" width="12" height="2"/>
            </svg>
        </button>
    </div>

    <!-- Sidebar Overlay (Mobile) -->
    <div id="sidebar-overlay" class="lg:hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-20 hidden transition-opacity opacity-0"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="bg-[var(--bg-card)] border-r-2 border-[var(--border-muted)] w-[320px] lg:w-[320px] flex-shrink-0 h-full flex flex-col z-50 fixed lg:relative">
        <div class="h-16 flex items-center justify-between px-4 lg:px-5 border-b-2 border-[var(--border-muted)] flex-shrink-0">
            <button onclick="app.renderHome()" class="font-pixel text-xl lg:text-2xl text-[var(--primary-green)] flex items-center gap-2.5 hover:text-emerald-300 transition-colors cursor-pointer focus:outline-none pixel-title-shadow group" title="Accueil">
                <span class="inline-block transform group-hover:scale-110 transition-transform sidebar-header-logo">
                    <svg class="w-7 h-7 lg:w-8 lg:h-8 flex-shrink-0" viewBox="0 0 16 16" fill="none" shape-rendering="crispEdges">
                        <path d="M2 1h12v10H2V1zm1 1v8h10V2H3z" fill="#00ff41"/>
                        <rect x="4" y="3" width="8" height="6" fill="#000000"/>
                        <rect x="5" y="4" width="2" height="1" fill="#00ff41"/>
                        <rect x="6" y="5" width="2" height="1" fill="#00ff41"/>
                        <rect x="5" y="6" width="2" height="1" fill="#00ff41"/>
                        <rect x="8" y="7" width="3" height="1" fill="#00cc33"/>
                        <rect x="12" y="9" width="1" height="1" fill="#ff9f00"/>
                        <rect x="6" y="11" width="4" height="2" fill="#00cc33"/>
                        <rect x="4" y="13" width="8" height="2" fill="#00ff41"/>
                    </svg>
                </span>
                <span class="sidebar-header-text">IT CAMPUS</span>
            </button>
            <!-- Bouton Desktop : [<] (Ghost button) -->
            <button onclick="app.toggleDesktopSidebar()" id="sidebar-collapse-btn" class="sidebar-toggle-btn px-2.5 py-1.5 bg-transparent border-0 text-[var(--text-muted)] hover:text-[var(--primary-green)] transition-colors focus:outline-none font-mono text-xs font-bold hidden lg:flex items-center" title="Mode Focus : Masquer la barre latérale">
                <span>[&lt;]</span>
            </button>
            <!-- Bouton Mobile : [X] (Ghost button) -->
            <button onclick="app.closeMobileMenu()" id="sidebar-close-btn" class="sidebar-toggle-btn px-2.5 py-1.5 bg-transparent border-0 text-[var(--text-muted)] hover:text-rose-400 transition-colors focus:outline-none font-mono text-xs font-bold lg:hidden flex items-center" title="Fermer le menu">
                <span>[X]</span>
            </button>
        </div>
        

        <nav class="flex-1 overflow-y-auto p-4 space-y-4" id="nav-container">
            <!-- Sidebar injected by JS -->
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 h-full overflow-y-auto bg-[var(--bg-app)] pt-16 lg:pt-0 scroll-smooth relative" id="main-content">
        <!-- Desktop Floating Toggle (hidden by default) -->
        <button id="desktop-toggle-btn" onclick="app.toggleDesktopSidebar()" class="hidden lg:flex fixed top-4 left-4 z-40 p-2.5 bg-zinc-900 border-2 border-zinc-700 text-amber-400 hover:text-amber-300 pixel-btn shadow-[3px_3px_0px_#000] transition-all focus:outline-none opacity-0 pointer-events-none" title="Afficher le menu">
            <svg class="w-5 h-5" viewBox="0 0 16 16" fill="currentColor" shape-rendering="crispEdges">
                <rect x="2" y="3" width="12" height="2"/>
                <rect x="2" y="7" width="12" height="2"/>
                <rect x="2" y="11" width="12" height="2"/>
            </svg>
        </button>
        <!-- Content injected by JS -->
    </main>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
